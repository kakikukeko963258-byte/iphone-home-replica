name: iPhoneHomeReplica
options:
  bundleIdPrefix: com.studyquiz
  deploymentTarget:
    iOS: '16.0'
targets:
  iPhoneHomeReplica:
    type: application
    platform: iOS
    sources: [Main/HomeLayout.swift, Main/MainApp.swift, Main/Artwork.swift, Main/EditingWiggle.swift, Main/HomeIconMenu.swift, Main/IconTouchSurface.swift, Main/LiftFeedback.swift, Main/Assets.xcassets]
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: iPhone Home
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studyquiz.dailyquiz
        PRODUCT_NAME: iPhoneHomeReplica
        INFOPLIST_KEY_CFBundleDisplayName: iPhone Home
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  iPhoneHomeReplica:
    build:
      targets:
        iPhoneHomeReplica: all
