name: Build iPhone Home Replica IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iphone-home-replica-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone app
        run: xcodebuild -project iPhoneHomeReplica.xcodeproj -scheme iPhoneHomeReplica -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: bash scripts/package-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-home-replica-ipa
          path: dist/iPhoneHomeReplica.ipa
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="replica-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/iPhoneHomeReplica.ipa --title "iPhone Home Replica ${GITHUB_RUN_NUMBER}" --notes "Two-page iPhone home screen recreation. Bundle ID com.studyquiz.dailyquiz; replaces StudyQuiz when installed." --target "$GITHUB_SHA"
